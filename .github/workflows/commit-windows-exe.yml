name: Commit Windows Installer to Repository

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-commit-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build app EXE
        run: |
          pyinstaller --onefile --name BeyondTheNakedEye -m beyond_naked_eye

      - name: Build installer EXE with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "beyond_naked_eye\install\installer.iss"

      - name: Optional code-sign installer EXE (if cert secrets are set)
        if: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 != '' && secrets.WINDOWS_CODESIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("codesign.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}"))
          & signtool sign /f codesign.pfx /p "${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Output/BeyondTheNakedEye_Setup.exe

      - name: Copy installer into repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          Copy-Item -Force Output/BeyondTheNakedEye_Setup.exe installers/BeyondTheNakedEye_Setup.exe
          (Get-FileHash installers/BeyondTheNakedEye_Setup.exe -Algorithm SHA256).Hash | Out-File installers/BeyondTheNakedEye_Setup.exe.sha256 -Encoding ascii

      - name: Commit installer to current branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/BeyondTheNakedEye_Setup.exe installers/BeyondTheNakedEye_Setup.exe.sha256
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "Update committed Windows setup installer"
          git push
