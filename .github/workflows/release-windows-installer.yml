name: Release Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build app EXE
        run: |
          pyinstaller --onefile --name BeyondTheNakedEye -m beyond_naked_eye

      - name: Build installer EXE with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "beyond_naked_eye\install\installer.iss"

      - name: Optional code-sign installer EXE (if cert secrets are set)
        if: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 != '' && secrets.WINDOWS_CODESIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("codesign.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}"))
          & signtool sign /f codesign.pfx /p "${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Output/BeyondTheNakedEye_Setup.exe

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          (Get-FileHash Output/BeyondTheNakedEye_Setup.exe -Algorithm SHA256).Hash | Out-File Output/BeyondTheNakedEye_Setup.exe.sha256 -Encoding ascii

      - name: Attach installer and checksum to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/BeyondTheNakedEye_Setup.exe
            Output/BeyondTheNakedEye_Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-naked-eye-installer
          path: |
            Output/BeyondTheNakedEye_Setup.exe
            Output/BeyondTheNakedEye_Setup.exe.sha256
