name: Web CI

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install sherlock_project (CLI — necessário para apps.core.services)
        run: pip install -e ..

      - name: Install web dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=apps --cov-report=term-missing
        # --cov-fail-under=70 será ativado no Dia 5 quando a suíte estiver verde
